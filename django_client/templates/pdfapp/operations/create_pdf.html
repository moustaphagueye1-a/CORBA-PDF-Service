{% extends 'pdfapp/base.html' %}
{% block title %}Créer un PDF{% endblock %}
{% block content %}
<div style="max-width:640px">
<div class="d-flex align-items-center gap-2 mb-1">
  <a href="/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
  <h1 class="page-title mb-0">✨ Créer un PDF</h1>
</div>
<p class="page-subtitle">Générer un PDF depuis du texte brut</p>
<div class="card"><div class="card-header-custom"><h4>Créer un PDF</h4><p>Saisissez le titre et le contenu du document</p></div>
<div class="card-body p-4">
<form method="post">{% csrf_token %}
  <div class="mb-3">
    <label class="form-label fw-semibold">Titre du document</label>
    <input type="text" class="form-control" name="title" placeholder="Mon Document PDF" required>
  </div>
  <div class="mb-3">
    <label class="form-label fw-semibold">Contenu</label>
    <textarea class="form-control" name="content" rows="10" placeholder="Saisissez votre texte ici..." required style="font-family:monospace"></textarea>
    <div class="form-text">Utilisez les retours à la ligne pour formater le texte.</div>
  </div>
  <button type="submit" class="btn-primary-custom"><i class="bi bi-play-fill"></i> Créer via CORBA</button>
</form></div></div></div>{% endblock %}

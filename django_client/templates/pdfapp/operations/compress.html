{% extends 'pdfapp/base.html' %}
{% block title %}Compression PDF{% endblock %}
{% block content %}
<div style="max-width:640px">
<div class="d-flex align-items-center gap-2 mb-1">
  <a href="/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
  <h1 class="page-title mb-0">📦 Compression PDF</h1>
</div>
<p class="page-subtitle">Réduire la taille du fichier PDF</p>
<div class="card"><div class="card-header-custom"><h4>Compression PDF</h4><p>PDFBox réoptimise la structure interne</p></div>
<div class="card-body p-4">
<form method="post" enctype="multipart/form-data">{% csrf_token %}
  <div class="mb-3">
    <label class="form-label fw-semibold">Fichier PDF à compresser</label>
    <div class="upload-zone"><div class="upload-icon">📦</div>
    <div class="fw-semibold upload-filename">Cliquez ou glissez votre fichier ici</div>
    <input type="file" name="pdf" accept=".pdf" required></div>
  </div>
  <button type="submit" class="btn-primary-custom"><i class="bi bi-play-fill"></i> Compresser via CORBA</button>
</form></div></div></div>{% endblock %}

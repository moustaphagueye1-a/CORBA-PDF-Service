{% extends 'pdfapp/base.html' %}
{% block title %}Découpage PDF{% endblock %}
{% block content %}
<div style="max-width:640px">
<div class="d-flex align-items-center gap-2 mb-1">
  <a href="/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
  <h1 class="page-title mb-0">✂️ Découpage PDF</h1>
</div>
<p class="page-subtitle">Extraire une plage de pages continues</p>
<div class="card"><div class="card-header-custom"><h4>Découpage PDF</h4><p>Spécifiez la plage de pages à extraire</p></div>
<div class="card-body p-4">
<form method="post" enctype="multipart/form-data">{% csrf_token %}
  <div class="mb-3">
    <label class="form-label fw-semibold">Fichier PDF</label>
    <div class="upload-zone"><div class="upload-icon">📄</div>
    <div class="fw-semibold upload-filename">Cliquez ou glissez votre fichier ici</div>
    <input type="file" name="pdf" accept=".pdf" required></div>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-6">
      <label class="form-label fw-semibold">Page de début</label>
      <input type="number" class="form-control" name="from_page" value="1" min="1" required>
    </div>
    <div class="col-6">
      <label class="form-label fw-semibold">Page de fin</label>
      <input type="number" class="form-control" name="to_page" value="1" min="1" required>
    </div>
  </div>
  <button type="submit" class="btn-primary-custom"><i class="bi bi-play-fill"></i> Découper via CORBA</button>
</form></div></div></div>{% endblock %}

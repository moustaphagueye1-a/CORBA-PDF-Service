# render.yaml — Déploiement automatique sur Render.com (plan gratuit)
# Les fichiers media sont temporaires sur le plan free (perdus au redémarrage)
# Pour la persistance, passer au plan Starter ($7/mois) et ajouter un disk

services:
  - type: web
    name: corba-pdf-service
    runtime: docker
    dockerfilePath: ./render-single/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORBA_SERVER_HOST
        value: localhost
      - key: BRIDGE_PORT
        value: "8080"
      - key: CORBA_IOR_FILE
        value: /shared/pdfservice.ior
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx200m -Djava.awt.headless=true"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings